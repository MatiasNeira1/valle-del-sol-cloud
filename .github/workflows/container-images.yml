name: Container images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/container-images.yml']
permissions: { contents: read, id-token: write }
env:
  ACR_NAME: ${{ vars.ACR_NAME }}
jobs:
  build-scan-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, ms-alerta-incendios, ms-monitoreo-geo, ms-notificaciones]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { client-id: '${{ secrets.AZURE_CLIENT_ID }}', tenant-id: '${{ secrets.AZURE_TENANT_ID }}', subscription-id: '${{ secrets.AZURE_SUBSCRIPTION_ID }}' }
      - run: az acr login --name "$ACR_NAME"
      - name: Build image
        run: docker build -f "backend/${{ matrix.service }}/Dockerfile" -t "$ACR_NAME.azurecr.io/${{ matrix.service }}:${{ github.sha }}" backend
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: '${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.sha }}', format: table, exit-code: '1', severity: 'CRITICAL,HIGH' }
      - run: docker push "$ACR_NAME.azurecr.io/${{ matrix.service }}:${{ github.sha }}"
