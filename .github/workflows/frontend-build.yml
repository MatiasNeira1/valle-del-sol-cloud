name: Frontend build
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-build.yml']
  push:
    branches: [main]
    paths: ['frontend/**']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        env:
          VITE_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          VITE_ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
          VITE_API_SCOPE: api://00000000-0000-0000-0000-000000000000/api.access
          VITE_API_URL: https://example.azure-api.net
        run: npm run build
