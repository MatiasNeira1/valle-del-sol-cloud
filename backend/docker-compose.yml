name: valle-del-sol

x-service-environment: &service-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-valle_del_sol}
  DB_USERNAME: ${DB_USERNAME:-valle_app}
  DB_PASSWORD: ${DB_PASSWORD:?Create backend/.env from backend/.env.example}
  DB_SSL_MODE: ${DB_SSL_MODE:-disable}
  AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:?Configure AZURE_API_AUDIENCE in backend/.env}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:?Configure the Entra issuer URI}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  SPRING_PROFILES_ACTIVE: local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-valle_del_sol}
      POSTGRES_USER: ${DB_USERNAME:-valle_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create backend/.env from backend/.env.example}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  ms-alerta-incendios:
    build: { context: ., dockerfile: ms-alerta-incendios/Dockerfile }
    environment: *service-environment
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: { test: [CMD, wget, -q, -O, -, http://127.0.0.1:8081/actuator/health], interval: 10s, timeout: 5s, retries: 12, start_period: 45s }
    networks: [internal]

  ms-monitoreo-geo:
    build: { context: ., dockerfile: ms-monitoreo-geo/Dockerfile }
    environment:
      <<: *service-environment
      MS_ALERTA_URL: http://ms-alerta-incendios:8081
    depends_on:
      postgres: { condition: service_healthy }
      ms-alerta-incendios: { condition: service_healthy }
    healthcheck: { test: [CMD, wget, -q, -O, -, http://127.0.0.1:8082/actuator/health], interval: 10s, timeout: 5s, retries: 12, start_period: 45s }
    networks: [internal]

  ms-notificaciones:
    build: { context: ., dockerfile: ms-notificaciones/Dockerfile }
    environment: *service-environment
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: { test: [CMD, wget, -q, -O, -, http://127.0.0.1:8083/actuator/health], interval: 10s, timeout: 5s, retries: 12, start_period: 45s }
    networks: [internal]

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    environment:
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:?Configure AZURE_API_AUDIENCE in backend/.env}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:?Configure the Entra issuer URI}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MS_ALERTA_URL: http://ms-alerta-incendios:8081
      MS_MONITOREO_URL: http://ms-monitoreo-geo:8082
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8083
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    env_file:
      - .env
    depends_on:
      ms-alerta-incendios: { condition: service_healthy }
      ms-monitoreo-geo: { condition: service_healthy }
      ms-notificaciones: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
    driver: bridge
volumes:
  postgres-data:
